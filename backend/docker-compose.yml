# Trusted Ocean database: PostgreSQL 17 + TimescaleDB (pinned version, same on Mac and Ubuntu).
# Start: npm run db:up    Stop: npm run db:down    (data is kept in the "ocean_db" volume)
services:
  db:
    image: timescale/timescaledb:2.26.1-pg17
    container_name: trusted-ocean-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-trusted_ocean}
      POSTGRES_USER: ${DB_USER:-ocean}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"   # only reachable from this computer
    volumes:
      - ocean_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  ocean_db:
